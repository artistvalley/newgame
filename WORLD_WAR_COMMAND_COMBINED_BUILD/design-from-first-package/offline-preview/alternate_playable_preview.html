<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WORLD WAR COMMAND — Playable Preview</title><style>
:root{color-scheme:dark;--bg:#080f1d;--panel:#121f32;--panel2:#182a42;--gold:#e7b75b;--muted:#9aabc1;--line:#293e57;--cyan:#65d5d1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 65% -30%,#233d62,#080f1d 68%);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf2ff}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#0c1627;border-right:1px solid var(--line);padding:25px 15px;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:900;letter-spacing:1px;color:var(--gold);line-height:1.1}.brand small{display:block;font-size:10px;letter-spacing:2.3px;color:var(--muted);margin-top:8px}.nav{display:grid;gap:7px;margin-top:35px}.nav button{background:none;color:#b5c5d9;border:0;border-radius:10px;text-align:left;padding:12px 14px}.nav button.active,.nav button:hover{background:#263a53;color:#fff}.sidefoot{position:absolute;bottom:24px;font-size:11px;color:var(--muted);padding:0 12px}.main{padding:28px;max-width:1500px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:800}h1{font-size:clamp(25px,3vw,39px);margin:3px 0 6px}h2{font-size:19px;margin:0 0 12px}p{color:#b6c6da;margin:7px 0 17px}.pill{border:1px solid #46617e;border-radius:30px;padding:8px 12px;color:#c9d8e9;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:23px 0}.card{background:linear-gradient(145deg,#16253b,#101b2e);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 10px 30px #0002}.stat b{display:block;font-size:25px;color:#fff}.stat span,.small{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(270px,1fr);gap:16px}.world{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:3px;max-width:720px;margin:auto}.tile{aspect-ratio:1;border:1px solid #34536a;border-radius:3px;background:#284c50;padding:0;color:#e4ffff;font-size:9px;min-width:0}.tile.water{background:#16314f;border-color:#26486a}.tile.mine{background:#7c5a39;border-color:#9c7645}.tile.own{background:#bd9348;border-color:#ffe4a5;color:#172337}.tile.enemy{background:#a64e56;border-color:#d57477}.tile.select{outline:2px solid #f5e8a3;outline-offset:1px}.btn{background:var(--gold);color:#152134;border:0;border-radius:9px;padding:11px 15px;font-weight:800}.btn.secondary{background:#273c56;color:#f2f7ff;border:1px solid #405773}.btn.danger{background:#63333d;color:#ffe8e8}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.notice{background:#142e3c;border-left:3px solid var(--cyan);padding:12px 14px;border-radius:6px;color:#d5edf0;margin:13px 0}.list{display:grid;gap:8px}.line{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #27374b;padding:10px 0}.line:last-child{border:0}.line strong{color:#f5d58c}.hidden{display:none!important}input,select{background:#0b1729;color:white;border:1px solid #3c536d;border-radius:8px;padding:11px;width:100%;margin:5px 0 12px}label{color:#c6d5e5;font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{border:1px solid #3d526a;background:#1c3049;color:white;padding:9px 12px;border-radius:8px}.tabs button.active{border-color:var(--gold);color:var(--gold)}.hero{background:linear-gradient(110deg,#1b3554 0%,#15233a 65%,#42372b 100%);border:1px solid #52617a;padding:22px;border-radius:16px;margin:20px 0}.hero h2{font-size:25px}.log{max-height:240px;overflow:auto}.tag{font-size:11px;color:var(--gold);letter-spacing:1px;text-transform:uppercase}.bar{height:8px;background:#293a4e;border-radius:20px;overflow:hidden}.bar>i{display:block;background:var(--cyan);height:100%}.mobilebar{display:none}.modal{position:fixed;inset:0;background:#020713c9;display:grid;place-items:center;padding:15px;z-index:5}.modal .card{max-width:470px;width:100%}@media(max-width:900px){.shell{display:block}.side{display:none}.main{padding:16px 13px 88px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.card{padding:15px}.world{gap:2px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#101c2eea;border-top:1px solid #34506d;justify-content:space-around;z-index:3;padding:9px 4px calc(9px + env(safe-area-inset-bottom))}.mobilebar button{background:none;border:0;color:#c6d4e5;font-size:11px;padding:7px}.mobilebar button.active{color:var(--gold)}.tile{font-size:7px}.top{align-items:flex-start}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">WORLD WAR<br>COMMAND<small>THE CIVILIZATION ENGINE</small></div><div class="nav" id="nav"></div><div class="sidefoot">LOCAL PLAYABLE PREVIEW<br>No live accounts or payments</div></aside><main class="main"><div class="top"><div><div class="eyebrow">Command centre · Interactive prototype</div><h1 id="heading">Your Civilization</h1><div class="small" id="subtitle"></div></div><div class="pill" id="clock"></div></div><div id="content"></div></main></div><div class="mobilebar" id="mobilebar"></div><div class="modal hidden" id="founder"><div class="card"><div class="eyebrow">Found a civilization</div><h2>Welcome, Commander</h2><p>Choose your country's name and government. Then claim connected territory on the world map.</p><label>Country name</label><input id="countryName" maxlength="32" value="New Aurora"><label>Government</label><select id="government"><option>Democracy</option><option>Republic</option><option>Constitutional Monarchy</option><option>Federation</option></select><button class="btn" onclick="found()">Create country</button></div></div><script>
const KEY='wwc_playable_v2';const navs=[['overview','⌂ Overview'],['world','◈ World Map'],['nation','⚑ My Nation'],['economy','◉ Economy'],['war','⚔ Warfare'],['diplomacy','◇ Diplomacy'],['zetos','✦ ZETOS'],['admin','⚙ Admin Demo']];const starter=()=>({name:'',government:'Democracy',day:1,treasury:1000000,reserves:0,population:100000,stability:70,zetos:0,claimed:[],selected:[],enemy:[66,67,80,81],priorities:['AGRICULTURE','ECONOMY','INFRASTRUCTURE'],stocks:{Food:0,Water:0,Wood:0,Ore:0,Stone:0,Energy:0,Goods:0},log:['The world awaits its next civilization.'],wars:0,alliances:0});let s;try{s={...starter(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{s=starter()}let page='overview',selectedTarget=null;const save=()=>localStorage.setItem(KEY,JSON.stringify(s)),fmt=n=>Math.floor(n).toLocaleString('en-IN'),log=t=>{s.log.unshift('Day '+s.day+': '+t);s.log=s.log.slice(0,40);save()};function setPage(p){page=p;render()}function isWater(i){return i%14===0||i%14===13||i<14||i>=182||((i*17+7)%29===0)}function isMine(i){return(i*13+11)%9===0}function adj(i,j){return Math.abs(Math.floor(i/14)-Math.floor(j/14))+Math.abs(i%14-j%14)===1}function choose(i){if(isWater(i)||s.enemy.includes(i)||s.claimed.includes(i))return;if(s.claimed.length>=6){log('Initial territory limit reached (6 regions).');render();return}if(s.claimed.length&&!s.claimed.some(j=>adj(i,j))){log('Choose a connected region next to your territory.');render();return}s.claimed.push(i);log('Claimed region '+(i+1)+(s.claimed.length===1?' as your capital.':'.'));render()}function found(){const name=document.getElementById('countryName').value.trim();if(name.length<3)return alert('Enter a country name of at least 3 characters.');s.name=name;s.government=document.getElementById('government').value;log(name+' founded.');render()}function tick(){if(!s.claimed.length)return alert('Claim territory first on the World Map.');const n=s.claimed.length;const foodTags=s.claimed.filter(i=>!isMine(i)).length,oreTags=s.claimed.filter(isMine).length;const food=foodTags*67500,water=foodTags*33750,wood=n*8000,ore=oreTags*6000,stone=oreTags*6000,energy=n*9000;const out={Food:food,Water:water,Wood:wood,Ore:ore,Stone:stone,Energy:energy,Goods:Math.min(7000,ore,s.stocks.Energy+energy)};for(const k in out)s.stocks[k]+=out[k];s.stocks.Ore-=out.Goods;s.stocks.Energy-=out.Goods;const needFood=s.population,needWater=Math.floor(s.population/2),fed=s.stocks.Food>=needFood&&s.stocks.Water>=needWater;s.stocks.Food=Math.max(0,s.stocks.Food-needFood);s.stocks.Water=Math.max(0,s.stocks.Water-needWater);const tax=Math.floor(s.population*.1*.125),reserve=Math.floor(tax*.15),upkeep=n*1800+Math.floor(s.treasury/500);s.treasury=Math.max(0,s.treasury+tax-reserve-upkeep);s.reserves+=reserve;s.population=Math.max(1000,Math.floor(s.population*(fed?1.002:.995)));s.stability=Math.max(0,Math.min(100,s.stability+(fed?1:-3)));s.day++;log((fed?'Population needs met.':'Food or water shortage!')+' Tax '+fmt(tax)+', upkeep '+fmt(upkeep)+'.');render()}function act(kind){if(kind==='peace'){s.alliances++;log('A diplomatic cooperation agreement was signed.')}else if(kind==='war'){if(s.claimed.length<2)return alert('Claim at least two regions first.');s.wars++;s.treasury=Math.max(0,s.treasury-50000);s.stability=Math.max(0,s.stability-2);log('Training battle resolved. Treasury −50,000, stability −2. Human-cost assessment required.')}else if(kind==='research'){if(s.treasury<25000)return alert('Insufficient treasury.');s.treasury-=25000;log('Research proposal submitted to the Imagination Lab (simulation only).')}save();render()}function tileHtml(){return '<div class="world">'+Array.from({length:196},(_,i)=>`<button title="Region ${i+1}" aria-label="Region ${i+1}" class="tile ${isWater(i)?'water':s.claimed.includes(i)?'own':s.enemy.includes(i)?'enemy':isMine(i)?'mine':''}" onclick="choose(${i})">${s.claimed[0]===i?'★':s.claimed.includes(i)?'⚑':s.enemy.includes(i)?'✕':''}</button>`).join('')+'</div>'}function line(k,v){return `<div class="line"><span>${k}</span><strong>${v}</strong></div>`}function box(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}function render(){document.getElementById('founder').classList.toggle('hidden',!!s.name);document.getElementById('heading').textContent=({overview:'Command Overview',world:'The World',nation:'My Nation',economy:'Civilization Economy',war:'Military Command',diplomacy:'Diplomacy & Peace',zetos:'ZETOS Wallet',admin:'Super Admin — Preview'})[page];document.getElementById('subtitle').textContent=(s.name||'Unfounded nation')+' · '+s.government+' · Offline local demonstration';document.getElementById('clock').textContent='◷ WORLD DAY '+s.day;document.getElementById('nav').innerHTML=navs.map(([k,v])=>`<button class="${page===k?'active':''}" onclick="setPage('${k}')">${v}</button>`).join('');document.getElementById('mobilebar').innerHTML=[['overview','⌂ Home'],['world','◈ World'],['nation','⚑ Nation'],['zetos','✦ ZETOS'],['admin','⚙ Admin']].map(([k,v])=>`<button class="${page===k?'active':''}" onclick="setPage('${k}')">${v}</button>`).join('');let stats=`<div class="stats">${[['Population',fmt(s.population)],['Treasury','₹ '+fmt(s.treasury)],['Stability',s.stability+'%'],['ZETOS',fmt(s.zetos)]].map(([k,v])=>`<div class="card stat"><span>${k}</span><b>${v}</b></div>`).join('')}</div>`;let c='';if(page==='overview')c=`<div class="hero"><div class="eyebrow">A living world. Your decisions matter.</div><h2>Build a nation. Protect its people.</h2><p>Claim land, produce resources, negotiate peace and face the human cost of conflict. This preview runs locally in your browser.</p><div class="actions"><button class="btn" onclick="setPage('world')">Explore World Map</button><button class="btn secondary" onclick="tick()">Advance One Game Day</button></div></div>${stats}<div class="grid">${box('Your Territory',tileHtml()+'<p class="small">Gold: your regions · Red: rival nation · Brown: ore-rich · Blue: water. Tap land to claim up to 6 connected regions.</p>')}${box('Command Dispatch',`<div class="notice">This is a playable prototype. No real payments, accounts, multiplayer or production connections.</div><div class="log">${s.log.map(x=>`<div class="line">${x}</div>`).join('')}</div>`)}</div>`;if(page==='world')c=`<div class="hero"><h2>Found your homeland</h2><p>Choose up to six connected land regions. Your first selection becomes your capital. Existing rival regions cannot be claimed.</p>${line('Regions claimed',s.claimed.length+' / 6')}</div><div class="grid">${box('Shared World — 14 × 14',tileHtml())}${box('Territory Inspector',line('Capital',s.claimed.length?'Region '+(s.claimed[0]+1):'Not selected')+line('Owned land',s.claimed.length)+line('Rival regions',s.enemy.length)+`<p>Every territory choice is saved in this browser. Online ownership requires a real server and database.</p>`)}</div>`;if(page==='nation')c=stats+`<div class="grid">${box('Government',line('Country',s.name)+line('System',s.government)+line('Capital',s.claimed.length?'Region '+(s.claimed[0]+1):'Not selected')+line('Territories',s.claimed.length)+line('National priorities',s.priorities.join(', ')))}${box('Decisions',`<p>Decisions affect your simulated country. Economic changes are local preview calculations.</p><div class="actions"><button class="btn" onclick="tick()">Advance Game Day</button><button class="btn secondary" onclick="act('research')">Fund Research (25,000)</button></div>`)}</div>`;if(page==='economy')c=stats+`<div class="grid">${box('Resource Stockpiles',Object.entries(s.stocks).map(([k,v])=>line(k,fmt(v))).join(''))}${box('Economic Policy',line('Agriculture budget','40%')+line('Industry budget','20%')+line('Infrastructure budget','25%')+line('Reserves budget','15%')+line('Tax rate','10%')+line('Reserve balance',fmt(s.reserves))+`<p>Illustrative economy tick only. Production formulas must be reconciled with the approved specification before deployment.</p><button class="btn" onclick="tick()">Process Next Day</button>`)}</div>`;if(page==='war')c=`<div class="hero"><div class="eyebrow">Conventional warfare only</div><h2>Victory has a human cost.</h2><p>Military decisions must account for casualties, displacement, damaged infrastructure, public protests, rehabilitation and peace.</p></div><div class="grid">${box('Training Battle',line('Battles simulated',s.wars)+line('Available treasury','₹ '+fmt(s.treasury))+`<p>This button runs a simplified local cost simulation, not the authoritative war engine.</p><button class="btn danger" onclick="act('war')">Simulate Battle Cost</button>`)}${box('AI Judge — Design Rules',`<p>Transparent outcomes based on military strength, logistics, diplomacy and civilian impact. ZETOS purchases never determine the judge's verdict.</p><div class="notice">Nuclear, chemical and biological weapons are prohibited.</div>`)}</div>`;if(page==='diplomacy')c=`<div class="grid">${box('International Relations',line('Cooperation agreements',s.alliances)+`<p>Negotiate, trade, establish alliances and prevent war.</p><button class="btn" onclick="act('peace')">Sign Demo Cooperation Treaty</button>`)}${box('Peace & Reconstruction',`<p>Future systems: ceasefires, peace conferences, humanitarian corridors, civilian recovery, sanctions and independent conflict reporting.</p>`)}</div>`;if(page==='zetos')c=`<div class="hero"><div class="eyebrow">Official virtual credits</div><h2>ZETOS — Build. Defend. Recover.</h2><p>Players may purchase ZETOS from the game operator. This preview has no payment gateway or real-money transactions.</p></div>${stats}<div class="grid">${box('Credit Packages',`<div class="list">${['₹100','₹500','₹1,000'].map(x=>`<div class="line"><span>${x} package <span class="small">· Rate not yet approved</span></span><button class="btn secondary" disabled>Coming soon</button></div>`).join('')}</div>`)}${box('Fair-Play Commitment',`<p>ZETOS may support approved purchases and development, but cannot buy an AI verdict, guaranteed victory or immunity from civilian consequences.</p><div class="notice">ZETOS balance: ${fmt(s.zetos)} · No purchases available in this preview.</div>`)}</div>`;if(page==='admin')c=`<div class="hero"><div class="eyebrow">Design preview · Not a secure admin service</div><h2>Super Admin Control Centre</h2><p>A practical responsive dashboard with separate management modules. Real administrator permissions and server-side controls are required before production use.</p></div><div class="stats">${[['Demo players','1'],['Demo countries','2'],['Claimed regions',s.claimed.length+s.enemy.length],['World day',s.day]].map(([k,v])=>`<div class="card stat"><span>${k}</span><b>${v}</b></div>`).join('')}</div><div class="grid">${box('Administration Modules',`<div class="list">${['Players & Roles','Countries & Territories','World Clock & Economy','Military & Diplomacy','ZETOS Wallets & Payments','Backups & Restore','Audit Logs & Security','Reports & System Health'].map(x=>`<div class="line">${x}<span class="small">Planned</span></div>`).join('')}</div>`)}${box('Safety & Recovery',`<div class="notice">This page does not connect to the live game. It cannot edit player records or deploy code.</div><button class="btn secondary" onclick="downloadSave()">Export Local Demo Save</button><div class="actions"><button class="btn danger" onclick="resetDemo()">Reset Local Preview</button></div>`)}</div>`;document.getElementById('content').innerHTML=c}function downloadSave(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='world-war-command-local-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function resetDemo(){if(confirm('Reset only this browser preview? No live records are affected.')){s=starter();save();page='overview';render()}}render();
</script></body></html>
